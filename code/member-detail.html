<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동아리 관리자 - 인원 상세</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="gnb-root"></div>
  <div class="container">
    <div class="card">
      <h1 class="title">개인별 상세 정보</h1>
      <div id="member-summary" class="muted">로딩 중...</div>
      <div id="page-status" class="status"></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2 class="subtitle">출석 이력</h2>
        <table>
          <thead>
            <tr>
              <th>날짜</th>
              <th>상태</th>
              <th>최종 수정</th>
            </tr>
          </thead>
          <tbody id="attendance-body"></tbody>
        </table>
      </div>

      <div class="card">
        <h2 class="subtitle">자기평가 내역</h2>
        <table>
          <thead>
            <tr>
              <th>작성시각</th>
              <th>시간</th>
              <th>내용</th>
            </tr>
          </thead>
          <tbody id="eval-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./common.js"></script>
  <script>
    if (!window.ClubApp.requireAuth()) {}
    window.ClubApp.setupGnb("");

    const params = new URLSearchParams(window.location.search);
    const memberId = Number(params.get("id"));
    const summaryEl = document.getElementById("member-summary");
    const attendanceBody = document.getElementById("attendance-body");
    const evalBody = document.getElementById("eval-body");

    function statusLabel(status) {
      if (status === "late") return "지각";
      if (status === "absent") return "결석";
      return "출석";
    }

    async function init() {
      if (!memberId) {
        window.ClubApp.setStatus("잘못된 인원 ID입니다.", "error");
        summaryEl.textContent = "인원을 찾을 수 없습니다.";
        return;
      }
      try {
        const detail = await window.ClubApp.getMemberDetail(memberId);
        const m = detail.member;
        summaryEl.innerHTML = `
          <strong>${m.name}</strong> / ${m.team_no}조 / ${m.role === "leader" ? "조장" : "모둠원"}
          <br>
          비고: ${m.note || "-"}
        `;

        attendanceBody.innerHTML = detail.attendance
          .map((a) => `
            <tr>
              <td>${a.date}</td>
              <td>${statusLabel(a.status)}</td>
              <td>${window.ClubApp.formatDateTime(a.updated_at || a.created_at)}</td>
            </tr>
          `)
          .join("");
        if (!detail.attendance.length) {
          attendanceBody.innerHTML = `<tr><td colspan="3" class="muted">출석 기록이 없습니다.</td></tr>`;
        }

        evalBody.innerHTML = detail.evaluations
          .map((e) => `
            <tr>
              <td>${window.ClubApp.formatDateTime(e.created_at)}</td>
              <td>${e.hour_slot}</td>
              <td>${e.content}</td>
            </tr>
          `)
          .join("");
        if (!detail.evaluations.length) {
          evalBody.innerHTML = `<tr><td colspan="3" class="muted">자기평가 기록이 없습니다.</td></tr>`;
        }
      } catch (err) {
        window.ClubApp.setStatus(err.message || "상세 정보를 불러오지 못했습니다.", "error");
      }
    }

    init();
  </script>
</body>
</html>
